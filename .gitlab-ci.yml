# InterviewOS GitLab CI

stages:
  - test

backend:
  stage: test
  # python 3.12 与 pyproject.toml 的 mypy python_version 对齐（numpy 类型存根需要 3.12+ 语法）；
  # requires-python >=3.11 不变，最低支持版本仍为 3.11
  image: python:3.12-slim
  variables:
    INTERVIEWOS_TEST_MODE: "1"
    ENV: "dev"
    LLM_API_KEY: "test-key"
    LLM_API_BASE: "http://127.0.0.1:9999/v1"
    CORS_ORIGINS: "http://localhost:8080"
  before_script:
    - cd backend
    - pip install -q -r requirements.txt
    # 工具链固定版本（与本地验证一致）：ruff 0.16 默认规则集扩张会导致 252 错
    - pip install -q ruff==0.15.20 mypy==2.1.0 pytest-cov==7.1.0 pip-audit==2.10.1
  script:
    - ruff check app/
    - python -m mypy app/ --ignore-missing-imports
    # 覆盖率 60% 为防回退下限；升 70% 需先补 STT 厂商适配器单测
    - pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60
    # chromadb PYSEC-2026-311 精确忽略（无修复版本），其余漏洞使 CI 失败（不再 || true 静默放行）
    - pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-311
  rules:
    - changes:
        - backend/**/*
        - test/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

frontend:
  stage: test
  image: node:20-slim
  before_script:
    - cd frontend
    - npm ci
  script:
    - npx tsc --noEmit
    - npm run lint
    - npm run test
    - npm run build
    # 依赖审计：lockfile 已锁定 brace-expansion 1.1.18（修复版），
    # 实测 npm audit 0 漏洞（含 moderate），high 以上直接使 CI 失败，不再 || true 放行
    - npm audit --audit-level=high
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
