# InterviewOS GitLab CI

stages:
  - test

backend:
  stage: test
  image: python:3.11-slim
  variables:
    INTERVIEWOS_TEST_MODE: "1"
    ENV: "dev"
    LLM_API_KEY: "test-key"
    LLM_API_BASE: "http://127.0.0.1:9999/v1"
    CORS_ORIGINS: "http://localhost:3000"
  before_script:
    - cd backend
    - pip install -q -r requirements.txt
    # 工具链固定版本（与本地验证一致）：ruff 0.16 默认规则集扩张会导致 252 错
    - pip install -q ruff==0.15.20 mypy==2.1.0 pytest-cov==7.1.0 pip-audit==2.10.1
  script:
    - ruff check app/
    - python -m mypy app/ --ignore-missing-imports
    # 覆盖率 60% 为防回退下限；升 70% 需先补 STT 厂商适配器单测
    - pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60
    # chromadb 无修复版本（PYSEC-2026-311），仅告警不阻断
    - pip-audit -r requirements.txt || true
  rules:
    - changes:
        - backend/**/*
        - test/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

frontend:
  stage: test
  image: node:20-slim
  before_script:
    - cd frontend
    - npm ci
  script:
    - npx tsc --noEmit
    # brace-expansion 为 typescript-estree 传递依赖，仅构建期使用，不阻断
    - npm audit --audit-level=high || true
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
